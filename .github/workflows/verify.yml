name: verify patch set

# Proves, on every push, that the patches still apply to a stock Joomla 3.10.12
# tree and that the probe finds nothing vulnerable afterwards. A patch set
# nobody re-verifies is a patch set nobody should trust.
on:
  push:
  pull_request:
  schedule:
    # Monthly, so bit-rot and tooling drift surface without a human remembering.
    - cron: '0 6 1 * *'

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none

      - name: Fetch Joomla 3.10.12
        run: |
          mkdir -p work/site
          curl -sSLo work/j3.tar.gz \
            https://github.com/joomla/joomla-cms/archive/refs/tags/3.10.12.tar.gz
          tar xzf work/j3.tar.gz -C work/site --strip-components=1

      - name: Probe before patching (expect findings)
        run: |
          set +e
          php tests/probe.php work/site
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::probe found nothing vulnerable on a STOCK tree - the probe is broken"
            exit 1
          fi
          echo "stock tree reports vulnerabilities, as expected"

      - name: Check patches apply
        run: bin/apply.sh work/site --check

      - name: Apply patches
        run: bin/apply.sh work/site

      - name: Probe after patching (expect clean)
        run: php tests/probe.php work/site

      - name: Lint every patched file
        run: |
          for f in \
            libraries/src/HTML/HTMLHelper.php \
            components/com_users/controllers/profile.php \
            libraries/src/Filter/InputFilter.php \
            libraries/vendor/joomla/filter/src/InputFilter.php
          do
            php -l "work/site/$f"
          done

      - name: Check patched XML is well-formed
        run: |
          for f in \
            administrator/components/com_newsfeeds/models/forms/newsfeed.xml \
            modules/mod_feed/mod_feed.xml \
            administrator/modules/mod_feed/mod_feed.xml
          do
            php -r 'exit(simplexml_load_file($argv[1]) === false ? 1 : 0);' "work/site/$f" \
              && echo "ok $f"
          done

      - name: Re-apply must be refused, not duplicated
        run: |
          set +e
          bin/apply.sh work/site --check
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::an already-patched tree still accepts the patches"
            exit 1
          fi
          echo "re-apply correctly refused"
